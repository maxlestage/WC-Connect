name: WCConnect
options:
  bundleIdPrefix: com.wcconnect
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_MODULE_VERIFIER: NO
    # Renseignez votre équipe de développement ici (ou dans Xcode > Signing).
    DEVELOPMENT_TEAM: ""

targets:

  # --- Application iPhone -----------------------------------------------
  WCConnect:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared/Core
      - path: Sources/Shared/Sync
      - path: Sources/iOS
      - path: Support/Assets.xcassets
      - path: Support/Audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wcconnect.app
        PRODUCT_NAME: WCConnect
        INFOPLIST_FILE: Support/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/iOS/entitlements.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: WCConnectWidgets
      - target: WCConnectWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  # --- Widgets + Live Activity (iOS) ------------------------------------
  WCConnectWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared/Core
      - path: Sources/Widgets
      - path: Support/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wcconnect.app.widgets
        PRODUCT_NAME: WCConnectWidgets
        INFOPLIST_FILE: Support/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Widgets/entitlements.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

  # --- Application Apple Watch ------------------------------------------
  WCConnectWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Shared/Core
      - path: Sources/Shared/Sync
      - path: Sources/Watch
      - path: Support/WatchAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wcconnect.app.watchkitapp
        PRODUCT_NAME: WCConnectWatch
        INFOPLIST_FILE: Support/Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Watch/entitlements.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
    dependencies:
      - target: WCConnectWatchWidgets

  # --- Complications Apple Watch ----------------------------------------
  WCConnectWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/Shared/Core
      - path: Sources/Widgets/TodayWidget.swift
      - path: Sources/WatchWidgets
      - path: Support/WatchAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wcconnect.app.watchkitapp.widgets
        PRODUCT_NAME: WCConnectWatchWidgets
        INFOPLIST_FILE: Support/WatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/WatchWidgets/entitlements.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

  # --- Tests unitaires ---------------------------------------------------
  # Les sources partagées sont compilées dans la cible de test : les tests de
  # logique tournent sans application hôte.
  WCConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/Shared/Core
      - path: Tests/WCConnectTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wcconnect.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WCConnect:
    build:
      targets:
        WCConnect: all
        WCConnectWidgets: all
        WCConnectWatch: all
        WCConnectWatchWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WCConnectTests
    archive:
      config: Release

  WCConnectWatch:
    build:
      targets:
        WCConnectWatch: all
        WCConnectWatchWidgets: all
    run:
      config: Debug
