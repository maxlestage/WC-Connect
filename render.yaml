# Hébergement statique de rechange : Render sert le dossier construit, sans
# serveur ni conteneur. Offre gratuite, déploiement automatique à chaque commit.
services:
  - type: web
    name: wc-connect-site
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: website/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SITE_URL
        value: https://wc-connect-site.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
