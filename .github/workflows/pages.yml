name: Pages

# Publie le site statique sur GitHub Pages. Aucun serveur : le dépôt sert des
# fichiers, c'est tout.
#
# **Déclenchement manuel uniquement.** Ce travail échoue tant que GitHub Pages
# n'est pas activé sur le dépôt (Settings → Pages → Source : GitHub Actions) :
# « Get Pages site failed ». Déclenché à chaque commit sur `master`, il y
# rendait donc la CI rouge en permanence, alors que le site est déployé sur
# Heroku et que Pages n'a jamais été activé.
#
# Deux choses à savoir avant de l'activer : le dépôt est privé, et Pages y
# demande un abonnement payant ; et il faut choisir « GitHub Actions » comme
# source, pas une branche.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        env:
          # Pages sert le projet sous /<dépôt>/ ; les balises de partage ont
          # besoin de l'origine complète.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
