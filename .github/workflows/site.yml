name: Site

# Vérifie le site statique : types, construction, et contenu du dossier
# publié. Il n'y a plus de serveur à démarrer.
on:
  push:
    branches: ["**"]
    paths:
      - "website/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - "Procfile"
      - "app.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - "Procfile"
      - "app.json"
      - ".github/workflows/site.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire le site
        env:
          VITE_SITE_URL: https://exemple.test
        run: npm run build

      - name: Vérifier le dossier publié
        run: |
          set -euo pipefail
          cd website/dist

          for fichier in index.html social-card.png logo.svg favicon.svg; do
            test -s "$fichier" || { echo "manquant ou vide : $fichier"; exit 1; }
          done

          ls assets/*.js  > /dev/null || { echo "aucun script construit"; exit 1; }
          ls assets/*.css > /dev/null || { echo "aucune feuille de style construite"; exit 1; }

          # Les aperçus de partage exigent des URL absolues, injectées à la
          # construction puisqu'il n'y a plus de serveur pour le faire.
          grep -q 'og:image" content="https://exemple.test/social-card.png"' index.html \
            || { echo "og:image non absolu"; exit 1; }
          ! grep -q '__SITE_URL__' index.html \
            || { echo "marqueur __SITE_URL__ resté dans la page"; exit 1; }

          echo "dossier publié conforme"

      - name: Servir le dossier publié tel quel
        run: |
          set -euo pipefail
          cd website/dist
          python3 -m http.server 8080 &
          serveur=$!
          for essai in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/social-card.png
          kill $serveur
          echo "hebergement statique : fichiers servables tels quels"

      - name: Reconstruire sans origine figee, comme sur Heroku
        run: npm run build

      - name: Verifier le serveur Node d'Heroku
        run: |
          set -euo pipefail
          PORT=8090 node website/server.js &
          serveur=$!
          for essai in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:8090/healthz; then break; fi
            sleep 1
          done

          curl -fsS http://localhost:8090/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/social-card.png)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/route/inconnue)" = "404"

          curl -fsS -H 'Host: exemple.test' -H 'X-Forwarded-Proto: https' http://localhost:8090/ | grep -q 'og:image" content="https://exemple.test/social-card.png"'
          curl -fsS -H 'Host: "><script>x</script>' http://localhost:8090/ | grep -q 'og:image" content="/social-card.png"'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8090/../package.json')" = "404"

          kill $serveur
          echo "serveur Heroku conforme"

  mise-en-page:
    # Un site qui se balade latéralement sur un téléphone est un défaut : ce
    # travail le vérifie à seize largeurs, dans les deux langues, menu du
    # burger fermé puis ouvert, puis à trois tailles de texte du navigateur. Il
    # contrôle aussi les maquettes d'appareils, le panneau du menu à hauteur
    # d'écran réelle, la cohérence du thème sombre, et la concordance des
    # chiffres annoncés par le site avec le code de l'app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier la coherence du theme sombre
        run: npm run check:theme --workspace website

      - name: Installer Chromium
        run: npm exec --workspace website -- playwright install --with-deps chromium

      - name: Construire le site
        run: npm run build

      - name: Verifier l'absence de debordement horizontal
        run: |
          set -euo pipefail
          PORT=4173 node website/server.js &
          serveur=$!
          for essai in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:4173/healthz; then break; fi
            sleep 1
          done
          npm run check:overflow --workspace website -- http://localhost:4173/
          npm run check:hero --workspace website -- http://localhost:4173/
          npm run check:menu --workspace website -- http://localhost:4173/
          npm run check:claims --workspace website -- http://localhost:4173/
          kill $serveur
