name: Site

# Vérifie le site statique : types, construction, et contenu du dossier
# publié. Il n'y a plus de serveur à démarrer.
on:
  push:
    branches: ["**"]
    paths:
      - "website/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - ".github/workflows/site.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire le site
        env:
          VITE_SITE_URL: https://exemple.test
        run: npm run build

      - name: Vérifier le dossier publié
        run: |
          set -euo pipefail
          cd website/dist

          for fichier in index.html social-card.png logo.svg favicon.svg; do
            test -s "$fichier" || { echo "manquant ou vide : $fichier"; exit 1; }
          done

          ls assets/*.js  > /dev/null || { echo "aucun script construit"; exit 1; }
          ls assets/*.css > /dev/null || { echo "aucune feuille de style construite"; exit 1; }

          # Les aperçus de partage exigent des URL absolues, injectées à la
          # construction puisqu'il n'y a plus de serveur pour le faire.
          grep -q 'og:image" content="https://exemple.test/social-card.png"' index.html \
            || { echo "og:image non absolu"; exit 1; }
          ! grep -q '__SITE_URL__' index.html \
            || { echo "marqueur __SITE_URL__ resté dans la page"; exit 1; }

          echo "dossier publié conforme"

      - name: Servir le dossier publié et l'appeler
        run: |
          set -euo pipefail
          cd website/dist
          python3 -m http.server 8080 &
          serveur=$!
          for essai in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/social-card.png
          kill $serveur
          echo "fichiers servables tels quels"
