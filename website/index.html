<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Applique le thème choisi avant le premier rendu. Sans ça, un thème clair
  // choisi sur un appareil réglé en sombre provoquerait un éclair sombre au
  // chargement. En « automatique », aucun attribut n'est posé : la feuille de
  // style suit alors la requête de média.
  try {
    var choix = localStorage.getItem("wc-connect-theme");
    if (choix === "light" || choix === "dark") {
      document.documentElement.setAttribute("data-theme", choix);
    }
  } catch (erreur) {
    // Stockage indisponible : l'appareil décide, comme en « automatique ».
  }
</script>
<title>WC Connect — le suivi de vos pauses, sur iPhone et Apple Watch</title>
<meta name="description" content="WC Connect chronomètre vos passages aux toilettes, aide quand ça coince (posture, respiration guidée, ambiances sonores), affiche une Live Activity et se pilote depuis l'Apple Watch. 100 % hors ligne.">
<!-- La barre du navigateur suit le thème de la page : un bandeau clair
     au-dessus d'un site sombre se voit tout de suite sur un téléphone. -->
<meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<!-- Installation sur l'écran d'accueil. Le manifeste est écrit à la
     construction par vite.config.ts : lui seul connaît le sous-chemin de
     publication. iOS ne lit pas le manifeste et veut ses propres balises. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="WC Connect">
<meta name="application-name" content="WC Connect">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- __SITE_URL__ est remplacé par website/server.js par l'origine réellement
     servie : les aperçus de partage fonctionnent sur n'importe quel domaine. -->
<link rel="canonical" href="__SITE_URL__/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WC Connect">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="__SITE_URL__/">
<meta property="og:title" content="WC Connect — chaque pause compte vraiment">
<meta property="og:description" content="Chronomètre, aide quand ça coince, respiration guidée et ambiances sonores : le suivi discret de vos pauses, sans compte ni serveur.">
<meta property="og:image" content="__SITE_URL__/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="WC Connect — chaque pause compte vraiment">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="WC Connect — chaque pause compte vraiment">
<meta name="twitter:description" content="Chronomètre, aide quand ça coince, respiration guidée et ambiances sonores : le suivi discret de vos pauses, sans compte ni serveur.">
<meta name="twitter:image" content="__SITE_URL__/social-card.png">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
